/* GCSE recap = Years 9 + 10 content in one searchable revision space. */
CURRICULUM_DATA[11] = {};
Object.keys(CURRICULUM_DATA).filter(y=>y!=="11").forEach(()=>{});
const GCSE_SUBJECTS = new Set([...Object.keys(CURRICULUM_DATA[9]),...Object.keys(CURRICULUM_DATA[10])]);
GSSE:
for(const subject of GCSE_SUBJECTS){
  const y9=CURRICULUM_DATA[9][subject]||[]; const y10=CURRICULUM_DATA[10][subject]||[];
  if(y9.length||y10.length) CURRICULUM_DATA[11][subject]=[...JSON.parse(JSON.stringify(y9)),...JSON.parse(JSON.stringify(y10))];
}
CURRICULUM_DATA[11]["GCSE Recap Guide"]=[{title:"How to use GCSE Recap",summary:"Year 11 is recap rather than a new curriculum. Use this area to revisit Year 9 and Year 10 GCSE content, identify weak topics and practise exam-style questions.",subs:["Revisit Year 9 content","Revisit Year 10 content","Use checklists","Use active recall","Practise exam questions","Review mistakes"]}];

const yearNotes={7:"Year 7 KS3 curriculum supplied by the school.",8:"Year 8 KS3 curriculum supplied by the school.",9:"Year 9 introduces GCSE content in several subjects. Where the school refers to specification booklets, those booklets remain the detailed authority.",10:"Year 10 continues GCSE content and includes the subject-specific assessment and exam information supplied by the school.",11:"Year 11 is a GCSE recap year. This section reuses GCSE material from Years 9 and 10 rather than inventing new Year 11 topics."};
let currentYear=7,currentSubject="All",searchQuery="";
const yearBtns=document.querySelectorAll('.year-btn'),filters=document.getElementById('subject-filters'),grid=document.getElementById('topics-grid'),search=document.getElementById('search-input'),yearNote=document.getElementById('year-note');
const ICONS={Biology:'🧬',Chemistry:'⚗️',Physics:'⚡',Maths:'📐',English:'📚',French:'🇫🇷',German:'🇩🇪',Spanish:'🇪🇸',Geography:'🌍',History:'🏛️',Latin:'🏺','Classical Civilisation':'🏛️','Computer Science':'💻','Design & Technology':'🛠️','Art & Design – Fine Art':'🎨','Art & Design – Graphics':'🖥️',Music:'🎵','Physical Education':'🏃','Religious Studies':'☮️','English Language':'✍️','English Literature':'📖','GCSE Recap Guide':'🎯'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function escAttr(s){return encodeURIComponent(String(s));}
function key(y,s,t){return `sh-progress-${y}-${s}-${t}`;}
function progressFor(y,s,t,subCount){let obj=JSON.parse(localStorage.getItem(key(y,s,t))||'[]');return subCount?Math.round((obj.length/subCount)*100):0;}
function toggleDone(y,s,t,index){let k=key(y,s,t),obj=JSON.parse(localStorage.getItem(k)||'[]');if(obj.includes(index))obj=obj.filter(i=>i!==index);else obj.push(index);localStorage.setItem(k,JSON.stringify(obj));render();}
function detailedNotes(subject,topic,subtopic){
 const s=subject.toLowerCase();
 let html=`<h4>What this subtopic is about</h4><p><strong>${esc(subtopic)}</strong> is part of <strong>${esc(topic)}</strong> in Year ${currentYear} ${esc(subject)}. This section should be revised as a connected concept rather than as an isolated definition.</p>`;
 if(s.includes('math')) html+=`<h4>Core knowledge</h4><ul><li>Know the mathematical vocabulary and notation used in this subtopic.</li><li>Know the method, when to use it, and why each step is valid.</li><li>Keep units and exactness consistent where units are involved.</li><li>Check the answer using estimation, substitution, a diagram or an alternative method where possible.</li></ul><div class="formula-box">Method → Substitute/construct → Calculate → Check → Interpret</div><div class="exam-tip"><strong>Exam tip</strong>Write enough working for another person to follow your method. Do not rely on a final answer alone.</div>`;
 else if(s.includes('physics')||s.includes('chemistry')||s.includes('biology')) html+=`<h4>Core knowledge</h4><ul><li>Learn the key definitions and relationships in the school's specification for this subtopic.</li><li>Know the relevant variables, units, apparatus and observations.</li><li>Be able to explain the process at particle/cellular/system level where appropriate.</li><li>Use equations accurately and state units where required.</li><li>Distinguish observations, explanations and conclusions.</li></ul><div class="callout"><strong>Active recall:</strong> Close your notes and explain the subtopic from memory in 30–60 seconds. Then identify exactly which part you could not explain.</div>`;
 else if(s.includes('history')||s.includes('geography')||s.includes('religious')||s.includes('classical')) html+=`<h4>Core knowledge</h4><ul><li>Know the key people, places, dates, beliefs, processes or evidence relevant to this subtopic.</li><li>Understand relationships: cause, consequence, significance, change, continuity, comparison or impact, depending on the subject.</li><li>Use specific evidence rather than vague statements.</li><li>Practise explaining how evidence supports a judgement.</li></ul><div class="exam-tip"><strong>Exam tip</strong>Specific evidence is stronger than a general statement. Build answers around precise facts, examples, sources or case-study detail.</div>`;
 else if(s.includes('english')) html+=`<h4>Core knowledge</h4><ul><li>Know the relevant text, scene, theme, character, voice or technique.</li><li>Identify the writer's choices in language, form and structure where relevant.</li><li>Explain the effect of a choice, not merely name it.</li><li>Connect analysis to the question and wider context.</li></ul><div class="exam-tip"><strong>Exam tip</strong>Move from evidence → method → effect → interpretation → wider argument.</div>`;
 else if(s.includes('french')||s.includes('german')||s.includes('spanish')) html+=`<h4>Core knowledge</h4><ul><li>Learn the vocabulary as active recall, not only recognition.</li><li>Know the grammar needed to build accurate sentences.</li><li>Practise the topic in present, past and future time frames where your course requires them.</li><li>Use opinions, reasons and conjunctions to make answers more developed.</li><li>Practise translation in both directions where appropriate.</li></ul><div class="formula-box">Idea → accurate vocabulary → correct grammar → opinion/reason → developed sentence</div>`;
 else if(s.includes('latin')) html+=`<h4>Core knowledge</h4><ul><li>Learn vocabulary actively and recognise endings in context.</li><li>Identify the case, number and gender of nouns and the tense, person, number and voice of verbs.</li><li>Use syntax to establish how words relate to each other.</li><li>Translate the whole sense of the sentence rather than translating word-by-word without structure.</li></ul>`;
 else if(s.includes('art')) html+=`<h4>Core knowledge</h4><ul><li>Record ideas carefully and consistently.</li><li>Explain artistic influences and decisions.</li><li>Experiment with media and techniques rather than producing only a final outcome.</li><li>Show development from research through experimentation to final intention.</li></ul>`;
 else if(s.includes('music')) html+=`<h4>Core knowledge</h4><ul><li>Identify the musical features specified for the work or theory area.</li><li>Use correct musical vocabulary when describing what you hear.</li><li>Practise short listening, recognition and dictation tasks regularly.</li></ul>`;
 else if(s.includes('physical')) html+=`<h4>Core knowledge</h4><ul><li>Learn the terminology and principles that describe the area.</li><li>Connect theoretical knowledge to sporting performance and practical examples.</li><li>Use applied examples to explain why a principle matters.</li></ul>`;
 else if(s.includes('design')) html+=`<h4>Core knowledge</h4><ul><li>Know material properties, processes, mechanisms and design terminology.</li><li>Explain why a material or process is suitable rather than simply naming it.</li><li>Consider environmental, social, moral, ethical, ergonomic and aesthetic factors where relevant.</li></ul>`;
 else html+=`<h4>Core knowledge</h4><p>Use the supplied curriculum list as the minimum coverage for this subtopic and build your notes around precise definitions, examples, evidence and exam technique relevant to the subject.</p>`;
 html+=`<h4>Quick self-check</h4><ol><li>Can you explain <strong>${esc(subtopic)}</strong> without your notes?</li><li>Can you give a precise example?</li><li>Can you explain one common mistake or misconception?</li><li>Can you answer an exam-style question on it?</li></ol>`;
 return html;
}
function makeAIPrompt(y,s,t,subs){return `I am a Year ${y} student revising ${s}.\n\nTopic: ${t}\n\nSubtopics:\n${subs.map(x=>'- '+x).join('\n')}\n\nAct as a revision tutor. Create a practice session based ONLY on the topic and subtopics above and at an appropriate level for Year ${y}. Ask one question at a time and wait for my answer. Mark my answer, explain what I did well, explain mistakes, give a hint if needed, then continue. Use a mix of recall, application and exam-style questions appropriate to the subject. Do not reveal all answers at once. At the end, give me a score, percentage, strengths, weak areas and a short revision plan. Start with Question 1.`;}
function render(){
 yearBtns.forEach(b=>b.classList.toggle('active',+b.dataset.year===currentYear));
 yearNote.textContent=yearNotes[currentYear];
 const yearData=CURRICULUM_DATA[currentYear]||{};const subjects=['All',...Object.keys(yearData)];if(!subjects.includes(currentSubject))currentSubject='All';
 filters.innerHTML=subjects.map(s=>`<button class="filter-chip ${s===currentSubject?'active':''}" onclick="selectSubject(decodeURIComponent('${escAttr(s)}'))">${ICONS[s]||'📘'} ${esc(s)}</button>`).join('');
 const q=searchQuery.toLowerCase().trim();const use=currentSubject==='All'?Object.keys(yearData):[currentSubject];let html='',count=0;
 use.forEach(subject=>{
  (yearData[subject]||[]).forEach(topic=>{
   const blob=[subject,topic.title,topic.summary,...topic.subs].join(' ').toLowerCase();if(q&&!blob.includes(q))return;count++;
   const p=progressFor(currentYear,subject,topic.title,topic.subs.length);const done=JSON.parse(localStorage.getItem(key(currentYear,subject,topic.title))||'[]');
   const subs=topic.subs.map((sub,i)=>{const checked=done.includes(i);return `<div class="subtopic ${q&&sub.toLowerCase().includes(q)?'active':''}" onclick="toggleSubtopic(this,event)"><div class="subtopic-header"><span>${esc((i+1)+'. '+sub)}</span><span aria-hidden="true">${checked?'✓':''}</span></div><div class="subtopic-content"><div>${detailedNotes(subject,topic.title,sub)}</div><div class="ai-box"><strong>AI practice prompt for this subtopic</strong><textarea readonly>${makeAIPrompt(currentYear,subject,topic.title,[sub])}</textarea><div class="row"><button class="copy-btn" onclick="copyText(this)">Copy AI prompt</button><button class="copy-btn" onclick="window.print()">Print page</button></div></div><label style="display:block;margin-top:1rem;font-weight:700"><input type="checkbox" ${checked?'checked':''} onchange="toggleDone(${currentYear},decodeURIComponent('${escAttr(subject)}'),decodeURIComponent('${escAttr(topic.title)}'),${i})"> Mark this subtopic revised</label></div></div>`}).join('');
   html+=`<article class="card" onclick="toggleCard(this)"><div class="card-header"><div><div class="card-subject">${ICONS[subject]||'📘'} ${esc(subject)}</div><div class="card-title">${esc(topic.title)}</div></div><div class="expand-badge">${p}% complete · View subtopics</div></div><div class="card-summary"><strong>Detailed topic summary:</strong> ${esc(topic.summary)}<br><br><strong>Coverage:</strong> This topic contains ${topic.subs.length} structured revision areas based on the supplied school topic list.</div><div class="progress-wrap"><div class="progress-row"><span>Revision progress</span><span>${p}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div></div><div class="subtopics-container" onclick="event.stopPropagation()"><div class="topic-overview"><strong>Before you start</strong>Work through every subtopic, tick each one when you can explain it from memory, then use the generated AI prompt for retrieval practice.</div><div class="topic-tools"><button data-year="${currentYear}" data-subject="${escAttr(subject)}" data-topic="${escAttr(topic.title)}" data-subs="${escAttr(JSON.stringify(topic.subs))}" onclick="copyTopicPromptFromButton(this,event)">📋 Copy AI Practice Prompt</button><button data-year="${currentYear}" data-subject="${escAttr(subject)}" data-topic="${escAttr(topic.title)}" onclick="openPracticeFromTopicButton(this,event)">📝 20 Practice Questions</button><button onclick="window.print()">🖨️ Print Topic</button><button onclick="completeTopic(event,${currentYear},decodeURIComponent('${escAttr(subject)}'),decodeURIComponent('${escAttr(topic.title)}'),${topic.subs.length})">✅ Mark All Complete</button></div>${subs}</div></article>`;
  });
 });
 grid.innerHTML=count?html:`<div class="empty-state"><h3>No detailed matches found</h3><p>Try a different search term or subject.</p></div>`;
}
function toggleCard(c){c.classList.toggle('expanded');const b=c.querySelector('.expand-badge');if(b)b.textContent=c.classList.contains('expanded')?'Hide subtopics':'View subtopics';}
window.toggleSubtopic=function(el,e){e.stopPropagation();el.classList.toggle('active');};
window.selectSubject=function(s){currentSubject=s;render();};
function copyText(btn){const ta=btn.closest('.ai-box').querySelector('textarea');navigator.clipboard.writeText(ta.value).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy AI prompt',1400);});}
function copyTopicPromptFromButton(btn,e){e.stopPropagation();const y=Number(btn.dataset.year),s=decodeURIComponent(btn.dataset.subject),t=decodeURIComponent(btn.dataset.topic),subs=JSON.parse(decodeURIComponent(btn.dataset.subs));const txt=makeAIPrompt(y,s,t,subs);navigator.clipboard.writeText(txt).then(()=>{btn.textContent="Copied ✓";setTimeout(()=>btn.textContent="📋 Copy AI Practice Prompt",1500);});}
function completeTopic(e,y,s,t,n){e.stopPropagation();localStorage.setItem(key(y,s,t),JSON.stringify([...Array(n).keys()]));render();}
function openPracticeFromTopicButton(btn,e){e.stopPropagation();const y=Number(btn.dataset.year),s=encodeURIComponent(btn.dataset.subject),t=encodeURIComponent(btn.dataset.topic);window.location.href=`practice.html?year=${y}&subject=${s}&topic=${t}`;}
function openProgressSummary(){const yearData=CURRICULUM_DATA[currentYear]||{};let total=0,done=0;Object.entries(yearData).forEach(([s,topics])=>topics.forEach(t=>{total+=t.subs.length;done+=JSON.parse(localStorage.getItem(key(currentYear,s,t.title))||'[]').length;}));alert(`Year ${currentYear} progress: ${total?Math.round(done/total*100):0}%\n${done} of ${total} subtopics marked as revised.`);}
search.addEventListener('input',e=>{searchQuery=e.target.value;render();});yearBtns.forEach(b=>b.addEventListener('click',()=>{currentYear=+b.dataset.year;currentSubject='All';searchQuery='';search.value='';render();}));render();
</script>
